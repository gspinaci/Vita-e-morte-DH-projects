[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhlife"
version = "2026.1"
description = "Data pipeline for 'Life and Death of DH Projects' — lifecycles of Italian Digital Humanities projects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy",
    "matplotlib>=3.7",
    "requests",
    "openpyxl",
]

[project.optional-dependencies]
crawl = ["beautifulsoup4", "lxml"]
extract = ["pymupdf", "ollama", "beautifulsoup4", "lxml", "tqdm"]
test = ["pytest>=8"]

[project.scripts]
dhlife = "dhlife.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
